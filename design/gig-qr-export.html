<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Gig — QR Export</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1440px; height: 900px; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    background: #EDEAE4;
    color: #1C1C1E;
    -webkit-font-smoothing: antialiased;
  }
  .desk {
    width: 1440px; height: 900px;
    background: #EDEAE4;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .desk-label {
    position: absolute;
    top: 48px; left: 56px;
    font-size: 13px; font-weight: 500;
    color: #6B6B70;
    letter-spacing: 0.02em;
  }
  .desk-label strong { color: #1C1C1E; font-weight: 600; }

  .export-card {
    width: 520px;
    background: #FFFFFF;
    border: 1px solid rgba(28,28,30,0.08);
    border-radius: 14px;
    box-shadow:
      0 1px 2px rgba(28,28,30,0.04),
      0 8px 24px rgba(28,28,30,0.06),
      0 24px 48px rgba(28,28,30,0.04);
    padding: 32px 32px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .poster-kicker {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #9A9A9E;
    margin-bottom: 18px;
    align-self: flex-start;
  }
  .qr-frame {
    width: 220px; height: 220px;
    padding: 14px;
    background: #FFFFFF;
    border: 1px solid rgba(28,28,30,0.10);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 22px;
  }
  .qr-frame img {
    width: 192px; height: 192px;
    image-rendering: pixelated;
    display: block;
  }
  .display-name {
    font-size: 22px;
    font-weight: 650;
    letter-spacing: -0.02em;
    color: #1C1C1E;
    margin-bottom: 6px;
    line-height: 1.25;
  }
  .provider-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .provider-name { font-size: 14px; font-weight: 600; color: #1C1C1E; }
  .provider-type {
    font-size: 12px; font-weight: 500; color: #6B6B70;
    background: rgba(28,28,30,0.04);
    border: 1px solid rgba(28,28,30,0.08);
    border-radius: 999px; padding: 2px 8px;
  }
  .uri-chip {
    font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: 11.5px; font-weight: 500; color: #3D5A73;
    background: rgba(61,90,115,0.08);
    border: 1px solid rgba(61,90,115,0.14);
    border-radius: 8px; padding: 8px 12px;
    margin-bottom: 14px; word-break: break-all;
    max-width: 100%; line-height: 1.4;
  }
  .note {
    font-size: 12.5px; font-weight: 500; color: #6B6B70;
    line-height: 1.5; margin-bottom: 22px; max-width: 380px;
  }
  .note strong { color: #1C1C1E; font-weight: 600; }
  .btn-export {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 40px; min-width: 148px; padding: 0 20px; border-radius: 8px;
    background: #3D5A73; color: #FFFFFF; font-size: 14px; font-weight: 600;
    font-family: inherit; border: none; cursor: default;
  }
  .btn-export svg {
    width: 14px; height: 14px; stroke: #FFFFFF; fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }
  .meta-foot { margin-top: 18px; font-size: 11px; color: #9A9A9E; font-variant-numeric: tabular-nums; }

</style>
</head>
