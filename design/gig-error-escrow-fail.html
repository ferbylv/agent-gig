<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Gig — 托管失败</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1440px; height: 900px; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
      "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    background: #EDEAE4;
    color: #1C1C1E;
    -webkit-font-smoothing: antialiased;
  }
  .host {
    width: 1440px; height: 900px;
    position: relative;
    background: #EDEAE4;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .desk-label {
    position: absolute;
    top: 48px; left: 56px;
    font-size: 13px; font-weight: 500;
    color: #6B6B70;
  }
  .desk-label strong { color: #1C1C1E; font-weight: 600; }
  .desk-meta {
    position: absolute;
    top: 48px; right: 56px;
    font-size: 12px; font-weight: 500;
    color: #9A9A9E;
  }
  .card {
    width: 460px;
    background: #FFFFFF;
    border: 1px solid rgba(28,28,30,0.08);
    border-radius: 14px;
    box-shadow:
      0 1px 2px rgba(28,28,30,0.04),
      0 8px 24px rgba(28,28,30,0.06),
      0 24px 48px rgba(28,28,30,0.04);
    padding: 32px 28px 28px;
    text-align: center;
  }
  .icon {
    width: 44px; height: 44px;
    border-radius: 999px;
    background: rgba(184,92,92,0.10);
    color: #B85C5C;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
  }
  .icon svg {
    width: 18px; height: 18px;
    stroke: #B85C5C; fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .card-title {
    font-size: 16px;
    font-weight: 650;
    letter-spacing: -0.01em;
    color: #1C1C1E;
    margin-bottom: 10px;
  }
  .card-body {
    font-size: 13.5px;
    font-weight: 400;
    color: #6B6B70;
    line-height: 1.55;
    margin-bottom: 24px;
  }
  .btn-row {
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 40px;
    min-width: 108px;
    padding: 0 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: default;
  }
  .btn-primary {
    background: #3D5A73;
    color: #FFFFFF;
    border: none;
  }
  .btn-secondary {
    background: rgba(28,28,30,0.05);
    color: #1C1C1E;
    border: 1px solid rgba(28,28,30,0.08);
  }
</style>
</head>
<body>
  <div class="host">
    <div class="desk-label"><strong>Agent Gig</strong> · 发单 · 托管失败</div>
    <div class="desk-meta">D-MVP-7 · Escrow</div>
    <div class="card" role="alert">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 18 18">
          <path d="M3.5 8.5V6.2c0-2.9 2.4-5.2 5.5-5.2s5.5 2.3 5.5 5.2v2.3"/>
          <rect x="2.5" y="8.5" width="13" height="8" rx="1.6"/>
          <circle cx="9" cy="12.5" r="1.1" fill="#B85C5C" stroke="none"/>
        </svg>
      </div>
      <div class="card-title">托管未成功，余额未锁定</div>
      <p class="card-body">网络或账本暂时未响应。资金仍在你的余额中，可稍后再试或返回检查发单信息。</p>
      <div class="btn-row">
        <button type="button" class="btn btn-primary">返回</button>
        <button type="button" class="btn btn-secondary">重试</button>
      </div>
    </div>
  </div>
</body>
</html>
