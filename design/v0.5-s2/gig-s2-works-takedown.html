<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Gig — 作品已下架</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1440px; height: 900px; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
      "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    background: #EDEAE4;
    color: #1C1C1E;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  button { font-family: inherit; cursor: default; }
  .desk {
    width: 1440px; height: 900px;
    background: #EDEAE4;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .desk-label {
    position: absolute;
    top: 40px; left: 48px;
    font-size: 13px; font-weight: 500;
    color: #6B6B70;
    letter-spacing: 0.02em;
  }
  .desk-label strong { color: #1C1C1E; font-weight: 600; }
  .desk-meta {
    position: absolute;
    top: 40px; right: 48px;
    font-size: 12px; font-weight: 500;
    color: #9A9A9E;
  }
  .shell {
    width: 960px;
    height: 700px;
    background: #FFFFFF;
    border-radius: 14px;
    border: 1px solid rgba(28,28,30,0.08);
    box-shadow:
      0 1px 2px rgba(28,28,30,0.04),
      0 12px 32px rgba(28,28,30,0.08),
      0 32px 64px rgba(28,28,30,0.05);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .shell-top {
    height: 56px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    border-bottom: 1px solid rgba(28,28,30,0.07);
  }
  .shell-title {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 15px;
    font-weight: 650;
  }
  .brand-mark {
    width: 22px; height: 22px;
    border-radius: 6px;
    background: #3D5A73;
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    display: grid;
    place-items: center;
  }
  .side-tag {
    font-size: 12px;
    font-weight: 600;
    color: #6B6B70;
    background: rgba(28,28,30,0.05);
    padding: 4px 10px;
    border-radius: 999px;
  }
  .body {
    flex: 1;
    background: #F7F5F1;
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .intro {
    font-size: 12.5px;
    font-weight: 500;
    color: #6B6B70;
    line-height: 1.5;
  }
  .intro strong { color: #1C1C1E; font-weight: 650; }

  .item {
    display: grid;
    grid-template-columns: 88px 1fr auto;
    gap: 16px;
    align-items: start;
    padding: 16px;
    background: #FFF;
    border-radius: 12px;
    border: 1px solid rgba(28,28,30,0.09);
  }
  .item.is-live {
    opacity: 0.92;
  }
  .item.is-down {
    border-color: rgba(184,92,92,0.28);
    background: #FFFAFA;
  }
  .thumb {
    width: 88px; height: 72px;
    border-radius: 8px;
    background: linear-gradient(145deg, #E8E4DC, #D9D4CA);
    display: grid;
    place-items: center;
    color: #9A9A9E;
    position: relative;
    overflow: hidden;
  }
  .item.is-down .thumb {
    background: linear-gradient(145deg, #E8DFDF, #D9CECE);
    filter: grayscale(0.35);
  }
  .thumb svg {
    width: 16px; height: 16px;
    stroke: currentColor; fill: none;
    stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
  }
  .item-main { min-width: 0; padding-top: 2px; }
  .item-title {
    font-size: 14.5px;
    font-weight: 650;
    letter-spacing: -0.01em;
    color: #1C1C1E;
    margin-bottom: 8px;
  }
  .item.is-down .item-title { color: #5A5A5E; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 24px;
    padding: 0 10px 0 8px;
    border-radius: 6px;
    font-size: 11.5px;
    font-weight: 650;
  }
  .badge svg { width: 11px; height: 11px; flex-shrink: 0; }
  .badge-verified {
    background: rgba(61,122,95,0.12);
    color: #3D7A5F;
    border: 1px solid rgba(61,122,95,0.28);
  }
  .badge-verified svg { fill: #3D7A5F; }
  .badge-down {
    background: rgba(184,92,92,0.12);
    color: #B85C5C;
    border: 1px solid rgba(184,92,92,0.32);
  }
  .badge-down svg {
    fill: none; stroke: #B85C5C; stroke-width: 1.7;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .reason {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 10px 12px;
    border-radius: 8px;
    background: rgba(184,92,92,0.06);
    border: 1px solid rgba(184,92,92,0.14);
  }
  .reason-mark {
    width: 18px; height: 18px;
    border-radius: 999px;
    background: rgba(184,92,92,0.14);
    color: #B85C5C;
    font-size: 11px;
    font-weight: 700;
    display: grid;
    place-items: center;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .reason-text {
    font-size: 13px;
    font-weight: 500;
    color: #8A4A4A;
    line-height: 1.5;
  }
  .item-meta {
    font-size: 12px;
    font-weight: 500;
    color: #9A9A9E;
    margin-top: 8px;
  }
  .item-side {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
    padding-top: 4px;
  }
  .status-pill {
    height: 26px;
    padding: 0 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 650;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .status-live {
    background: rgba(61,122,95,0.10);
    color: #3D7A5F;
  }
  .status-down {
    background: rgba(184,92,92,0.12);
    color: #B85C5C;
  }
  .status-down::before {
    content: "";
    width: 7px; height: 7px;
    border-radius: 1.5px;
    background: #B85C5C;
    transform: rotate(45deg);
  }
  .quiet-link {
    font-size: 12px;
    font-weight: 560;
    color: #6B6B70;
    background: none;
    border: none;
    padding: 0;
  }
  .note {
    margin-top: auto;
    padding: 12px 14px;
    border-radius: 10px;
    background: #FFF;
    border: 1px solid rgba(28,28,30,0.08);
    font-size: 12.5px;
    color: #6B6B70;
    line-height: 1.5;
  }
  .note strong { color: #1C1C1E; font-weight: 600; }
</style>
</head>
<body>
<div class="desk">
  <div class="desk-label"><strong>Agent Gig</strong> · Provider · 作品已下架</div>
  <div class="desk-meta">D-S2-4 · Takedown · 管理侧最小反馈</div>

  <div class="shell">
    <div class="shell-top">
      <div class="shell-title">
        <span class="brand-mark">AG</span>
        作品管理
      </div>
      <span class="side-tag">服务方视图 · 非公开列表</span>
    </div>

    <div class="body">
      <p class="intro">公开访客侧已不可见。以下为 <strong>provider</strong> 侧记录（含下架原因摘要）。</p>

      <article class="item is-live" aria-label="仍公开作品">
        <div class="thumb" aria-hidden="true">
          <svg viewBox="0 0 16 16"><rect x="2.5" y="3.5" width="11" height="9" rx="1.5"/><path d="M5.5 3.5V2.8a2.5 2.5 0 0 1 5 0v.7"/></svg>
        </div>
        <div class="item-main">
          <h3 class="item-title">代码审查交付摘要 · PR #482</h3>
          <div class="badges">
            <span class="badge badge-verified">
              <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.2l4.2 1.6v3.1c0 2.4-1.7 3.9-4.2 4.9C3.5 9.8 1.8 8.3 1.8 5.9V2.8L6 1.2z"/><path d="M3.8 5.9l1.5 1.5 2.9-3" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              成单验证
            </span>
          </div>
          <div class="item-meta">授权于 2026-08-21 · 公开中</div>
        </div>
        <div class="item-side">
          <span class="status-pill status-live">公开</span>
          <button type="button" class="quiet-link">查看</button>
        </div>
      </article>

      <article class="item is-down" aria-label="已下架作品">
        <div class="thumb" aria-hidden="true">
          <svg viewBox="0 0 16 16"><rect x="2.5" y="3.5" width="11" height="9" rx="1.5"/><path d="M5.5 3.5V2.8a2.5 2.5 0 0 1 5 0v.7"/><path d="M4 8.5h8"/></svg>
        </div>
        <div class="item-main">
          <h3 class="item-title">客户内网拓扑草稿（脱敏不全）</h3>
          <div class="badges">
            <span class="badge badge-down">
              <svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="2" width="8" height="8" rx="1.5"/><path d="M4 4l4 4M8 4l-4 4"/></svg>
              已下架
            </span>
          </div>
          <div class="reason" role="status">
            <span class="reason-mark" aria-hidden="true">!</span>
            <p class="reason-text">该作品因违规/举报已下架</p>
          </div>
          <div class="item-meta">下架于 2026-09-01 · 公开列表已移除</div>
        </div>
        <div class="item-side">
          <span class="status-pill status-down">已下架</span>
          <button type="button" class="quiet-link">申诉说明</button>
        </div>
      </article>

      <p class="note"><strong>访客侧：</strong>已下架项不出现在公开作品栏。本屏仅 provider / 管理反馈，不做恐吓式红盘闪烁。</p>
    </div>
  </div>
</div>
</body>
</html>
