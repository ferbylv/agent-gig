<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Gig — D-S2-2 授权勾选卡 · 已保存</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1440px; height: 900px; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
      "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    background: #EDEAE4;
    color: #1C1C1E;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  button { font-family: inherit; cursor: default; }
  .desk {
    width: 1440px; height: 900px;
    background: #EDEAE4;
    position: relative;
  }
  .desk-label {
    position: absolute;
    top: 40px; left: 48px;
    font-size: 13px; font-weight: 500;
    color: #6B6B70;
    letter-spacing: 0.02em;
    z-index: 3;
  }
  .desk-label strong { color: #1C1C1E; font-weight: 600; }
  .desk-meta {
    position: absolute;
    top: 40px; right: 48px;
    font-size: 12px; font-weight: 500;
    color: #9A9A9E;
    z-index: 3;
  }
  .host-bg {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.42;
    filter: saturate(0.85);
    pointer-events: none;
  }
  .shell {
    width: 1080px;
    height: 760px;
    background: #FFFFFF;
    border-radius: 14px;
    border: 1px solid rgba(28,28,30,0.08);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .shell-top {
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    border-bottom: 1px solid rgba(28,28,30,0.07);
  }
  .shell-title {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 15px;
    font-weight: 650;
  }
  .brand-mark {
    width: 24px; height: 24px;
    border-radius: 6px;
    background: #3D5A73;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    display: grid;
    place-items: center;
  }
  .status-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 26px;
    padding: 0 12px 0 10px;
    border-radius: 999px;
    background: rgba(61,122,95,0.12);
    color: #3D7A5F;
    font-size: 12px;
    font-weight: 600;
  }
  .status-chip::before {
    content: "";
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #3D7A5F;
  }
  .order-meta {
    font-size: 12.5px;
    font-weight: 500;
    color: #6B6B70;
  }
  .body-fill {
    flex: 1;
    padding: 20px 24px;
    background: #F7F5F1;
  }
  .ghost-card {
    height: 100%;
    background: #FFF;
    border-radius: 8px;
    border: 1px solid rgba(28,28,30,0.06);
  }
  .action-ghost {
    height: 72px;
    border-top: 1px solid rgba(28,28,30,0.07);
    background: #FFF;
  }
  .scrim {
    position: absolute;
    inset: 0;
    background: rgba(28,28,30,0.28);
    z-index: 1;
  }
  .modal {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 440px;
    background: #FFFFFF;
    border: 1px solid rgba(28,28,30,0.08);
    border-radius: 14px;
    box-shadow:
      0 1px 2px rgba(28,28,30,0.04),
      0 12px 32px rgba(28,28,30,0.12),
      0 32px 64px rgba(28,28,30,0.10);
    z-index: 2;
    overflow: hidden;
    padding: 28px 28px 26px;
  }
  .check-badge {
    width: 44px; height: 44px;
    border-radius: 999px;
    background: rgba(61,122,95,0.12);
    display: grid;
    place-items: center;
    margin-bottom: 16px;
  }
  .check-badge svg {
    width: 20px; height: 20px;
    stroke: #3D7A5F;
    fill: none;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .modal-title {
    font-size: 17px;
    font-weight: 650;
    letter-spacing: -0.02em;
    color: #1C1C1E;
    margin-bottom: 8px;
    line-height: 1.35;
  }
  .modal-sub {
    font-size: 13.5px;
    font-weight: 400;
    color: #6B6B70;
    line-height: 1.5;
    margin-bottom: 16px;
  }
  .flag-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 18px;
  }
  .flag-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 11px 14px;
    background: #F7F5F1;
    border: 1px solid rgba(28,28,30,0.07);
    border-radius: 10px;
  }
  .flag-name {
    font-size: 13.5px;
    font-weight: 550;
    color: #1C1C1E;
    line-height: 1.35;
  }
  .flag-pill {
    flex-shrink: 0;
    height: 24px;
    padding: 0 10px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 650;
    display: inline-flex;
    align-items: center;
  }
  .flag-pill.on {
    background: rgba(61,122,95,0.12);
    color: #3D7A5F;
  }
  .flag-pill.off {
    background: rgba(28,28,30,0.06);
    color: #9A9A9E;
  }
  .modal-foot {
    display: flex;
    align-items: center;
    justify-content: flex-end;
  }
  .btn {
    height: 40px;
    padding: 0 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    border: 1px solid transparent;
    background: #3D5A73;
    color: #FFFFFF;
    min-width: 88px;
  }
  .footnote {
    margin-top: 14px;
    font-size: 12px;
    font-weight: 500;
    color: #9A9A9E;
    line-height: 1.45;
  }
</style>
</head>
<body>
  <div class="desk">
    <div class="desk-label"><strong>Agent Gig</strong> · 验收 · 公开授权（可选）</div>
    <div class="desk-meta">D-S2-2 · 已保存偏好</div>
    <div class="host-bg" aria-hidden="true">
      <div class="shell">
        <div class="shell-top">
          <div class="shell-title">
            <div class="brand-mark">AG</div>
            订单验收
            <span class="status-chip">已验收 · 已放款</span>
          </div>
          <div class="order-meta">北湾工作室 · Agent CodeReviewer · 15 GigUSD</div>
        </div>
        <div class="body-fill"><div class="ghost-card"></div></div>
        <div class="action-ghost"></div>
      </div>
    </div>
    <div class="scrim"></div>
    <div class="modal" role="status" aria-labelledby="saved-title">
      <div class="check-badge" aria-hidden="true">
        <svg viewBox="0 0 20 20"><polyline points="4,10.5 8,14.5 16,5.5"/></svg>
      </div>
      <h1 class="modal-title" id="saved-title">已保存授权偏好</h1>
      <p class="modal-sub">本单公开范围已按下列选择生效。可随时撤回。</p>
      <div class="flag-list">
        <div class="flag-row">
          <span class="flag-name">写入接单方公开作品集</span>
          <span class="flag-pill on">已开启</span>
        </div>
        <div class="flag-row">
          <span class="flag-name">允许平台首页/推荐位展示</span>
          <span class="flag-pill off">未开启</span>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn">完成</button>
      </div>
      <p class="footnote">来源将标记为「经平台成单验收并获授权」。不含评价。</p>
    </div>
  </div>
</body>
</html>
