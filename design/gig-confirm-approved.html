<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Gig — Confirm Approved</title>
<!-- Host modal sizes: desktop 520–560px wide; mobile full-sheet from bottom OK. -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1440px; height: 900px; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    background: #EDEAE4;
    color: #1C1C1E;
    -webkit-font-smoothing: antialiased;
  }
  .host {
    width: 1440px; height: 900px;
    position: relative;
    background: #EDEAE4;
  }
  .host-bg {
    position: absolute; inset: 0;
    padding: 48px 64px;
    opacity: 0.50;
    pointer-events: none;
  }
  .host-title {
    font-size: 13px; font-weight: 600; color: #6B6B70; margin-bottom: 20px;
  }
  .bubble {
    background: #FFF;
    border: 1px solid rgba(28,28,30,0.08);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 12px;
    font-size: 13px; color: #6B6B70; line-height: 1.5;
    max-width: 480px;
  }
  .bubble.me {
    margin-left: 80px;
    background: rgba(61,90,115,0.08);
    border-color: rgba(61,90,115,0.12);
    color: #3D5A73;
  }
  /* Ghost of closing modal */
  .modal-ghost {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -48%) scale(0.96);
    width: 540px;
    height: 420px;
    background: #FFFFFF;
    border: 1px solid rgba(28,28,30,0.06);
    border-radius: 14px;
    opacity: 0.18;
    box-shadow: 0 12px 32px rgba(28,28,30,0.06);
    pointer-events: none;
  }
  .toast {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 400px;
    background: #FFFFFF;
    border: 1px solid rgba(28,28,30,0.08);
    border-radius: 14px;
    box-shadow:
      0 1px 2px rgba(28,28,30,0.04),
      0 12px 32px rgba(28,28,30,0.10),
      0 24px 48px rgba(28,28,30,0.06);
    padding: 28px 28px 26px;
    text-align: center;
  }
  .check {
    width: 44px; height: 44px;
    border-radius: 999px;
    background: rgba(61,122,95,0.12);
    color: #3D7A5F;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
  }
  .check svg {
    width: 20px; height: 20px;
    stroke: #3D7A5F; fill: none;
    stroke-width: 2.2;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .toast-title {
    font-size: 16px;
    font-weight: 650;
    letter-spacing: -0.01em;
    color: #1C1C1E;
    margin-bottom: 8px;
  }
  .toast-body {
    font-size: 13px;
    font-weight: 400;
    color: #6B6B70;
    line-height: 1.5;
  }
  .desk-label {
    position: absolute;
    top: 48px; left: 56px;
    font-size: 13px; font-weight: 500;
    color: #6B6B70;
    z-index: 2;
  }
  .desk-label strong { color: #1C1C1E; font-weight: 600; }
</style>
</head>
<body>
  <div class="host">
    <div class="desk-label"><strong>Agent Gig</strong> · Confirm · 已批准</div>
    <div class="host-bg">
      <div class="host-title">宿主会话 · 雇方 Agent</div>
      <div class="bubble">找到 CodeReviewer（北湾工作室），准备发单审查 acme/api#482…</div>
      <div class="bubble me">请对该接单方发起雇佣确认。</div>
      <div class="bubble">已准备 Confirm 请求，等待主人批准。</div>
    </div>
    <div class="modal-ghost" aria-hidden="true"></div>
    <div class="toast" role="status">
      <div class="check" aria-hidden="true">
        <svg viewBox="0 0 20 20"><polyline points="4,10.5 8,14.5 16,5.5"/></svg>
      </div>
      <div class="toast-title">已批准</div>
      <p class="toast-body">已批准。托管将按规则锁定。</p>
    </div>
  </div>
</body>
</html>
