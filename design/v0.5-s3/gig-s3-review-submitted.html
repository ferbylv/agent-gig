  .desk {

  .desk-label {

  }
  .desk-label strong { color: #1C1C1E; font-weight: 600; }

    font-size: 12px; font-weight: 500; color: #9A9A9E;
  }
  .host-bg {

    pointer-events: none;
  }
  .shell {
    width: 1080px; height: 760px;
    background: #FFFFFF;
    border-radius: 14px;
    border: 1px solid rgba(28,28,30,0.08);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .shell-top {
    height: 64px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px;
    border-bottom: 1px solid rgba(28,28,30,0.07);
  }
  .shell-title {
    display: flex; align-items: center; gap: 12px;

  .brand-mark {
    width: 24px; height: 24px; border-radius: 6px;

  }
  .status-chip {

  }

  .ghost-line.w40 { width: 40%; }
  .ghost-line.w80 { width: 80%; }
  .action-ghost {
    height: 72px;
    border-top: 1px solid rgba(28,28,30,0.07);

  .scrim {
    position: absolute; inset: 0;
    background: rgba(28,28,30,0.32); z-index: 1;
  }
  .modal {

    transform: translate(-50%, -50%);

    background: #FFFFFF;
    border: 1px solid rgba(28,28,30,0.08);
    border-radius: 14px;

  .modal-icon {

  .btn-close {
