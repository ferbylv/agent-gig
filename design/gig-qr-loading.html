<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Gig — QR Loading</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1440px; height: 900px; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    background: #EDEAE4;
    color: #1C1C1E;
    -webkit-font-smoothing: antialiased;
  }
  .desk {
    width: 1440px; height: 900px;
    background: #EDEAE4;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .desk-label {
    position: absolute;
    top: 48px; left: 56px;
    font-size: 13px; font-weight: 500;
    color: #6B6B70;
    letter-spacing: 0.02em;
  }
  .desk-label strong { color: #1C1C1E; font-weight: 600; }

  .load-panel {
    width: 420px;
    background: #FFFFFF;
    border: 1px solid rgba(28,28,30,0.08);
    border-radius: 14px;
    box-shadow:
      0 1px 2px rgba(28,28,30,0.04),
      0 8px 24px rgba(28,28,30,0.06),
      0 24px 48px rgba(28,28,30,0.04);
    padding: 48px 36px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .spinner {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 2.5px solid rgba(61,90,115,0.18);
    border-top-color: #3D5A73;
    margin-bottom: 22px;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .skeleton {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-bottom: 22px;
  }
  .sk-line {
    height: 10px;
    border-radius: 6px;
    background: linear-gradient(90deg, rgba(28,28,30,0.06) 0%, rgba(28,28,30,0.10) 50%, rgba(28,28,30,0.06) 100%);
    background-size: 200% 100%;
  }
  .sk-line.w1 { width: 56%; }
  .sk-line.w2 { width: 72%; }
  .sk-line.w3 { width: 40%; }
  .load-title {
    font-size: 16px;
    font-weight: 650;
    letter-spacing: -0.01em;
    color: #1C1C1E;
    margin-bottom: 14px;
  }
  .uri-chip {
    font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: 11.5px; font-weight: 500; color: #3D5A73;
    background: rgba(61,90,115,0.08);
    border: 1px solid rgba(61,90,115,0.14);
    border-radius: 8px; padding: 8px 12px;
    word-break: break-all; line-height: 1.4; max-width: 100%;
  }

</style>
</head>
<body>
  <div class="desk">
    <div class="desk-label"><strong>Agent Gig</strong> · D-MVP-2 · 短链打开</div>

    <div class="load-panel" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <div class="load-title">正在打开护照…</div>
      <div class="skeleton" aria-hidden="true">
        <div class="sk-line w1"></div>
        <div class="sk-line w2"></div>
        <div class="sk-line w3"></div>
      </div>
      <div class="uri-chip">https://pass.agentgig.example/a/did:gig:7a3f…c21</div>
    </div>

  </div>
</body>
</html>
