<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Gig — 额度超限</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1440px; height: 900px; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
      "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    background: #EDEAE4;
    color: #1C1C1E;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  button { font-family: inherit; cursor: default; }
  .desk {
    width: 1440px; height: 900px;
    background: #EDEAE4;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .desk-label {
    position: absolute;
    top: 40px; left: 48px;
    font-size: 13px; font-weight: 500;
    color: #6B6B70;
    letter-spacing: 0.02em;
  }
  .desk-label strong { color: #1C1C1E; font-weight: 600; }
  .desk-meta {
    position: absolute;
    top: 40px; right: 48px;
    font-size: 12px; font-weight: 500;
    color: #9A9A9E;
  }
  .panel {
    width: 900px;
    height: 640px;
    background: #FFFFFF;
    border-radius: 14px;
    border: 1px solid rgba(28,28,30,0.08);
    box-shadow:
      0 1px 2px rgba(28,28,30,0.04),
      0 12px 32px rgba(28,28,30,0.08),
      0 32px 64px rgba(28,28,30,0.05);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-top {
    height: 52px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px 0 22px;
    border-bottom: 1px solid rgba(28,28,30,0.07);
  }
  .panel-title {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: #1C1C1E;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .panel-title .brand-mark {
    width: 22px; height: 22px;
    border-radius: 6px;
    background: #3D5A73;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    display: grid;
    place-items: center;
    letter-spacing: -0.02em;
  }
  .panel-close {
    width: 28px; height: 28px;
    border: none; background: transparent;
    border-radius: 8px;
    display: grid; place-items: center;
    color: #6B6B70;
  }
  .panel-body {
    flex: 1; min-height: 0;
    display: flex; flex-direction: row;
  }
  .nav {
    width: 172px;
    flex-shrink: 0;
    padding: 12px 10px;
    border-right: 1px solid rgba(28,28,30,0.07);
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .nav-item {
    min-height: 44px;
    padding: 0 12px;
    border-radius: 8px;
    border: none;
    background: transparent;
    font-size: 13px;
    font-weight: 500;
    color: #6B6B70;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 8px;
    letter-spacing: 0.01em;
    width: 100%;
  }
  .nav-item.is-on {
    color: #3D5A73;
    background: rgba(61,90,115,0.12);
    font-weight: 600;
  }
  .nav-item.is-disabled {
    color: #9A9A9E;
    opacity: 0.72;
  }
  .nav-item .soon {
    margin-left: auto;
    font-size: 10px;
    font-weight: 500;
    color: #9A9A9E;
    letter-spacing: 0;
    white-space: nowrap;
  }
  .content {
    flex: 1;
    min-width: 0;
    padding: 26px 30px 28px;
    overflow: hidden;
  }
  .page-h {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 4px;
  }
  .page-sub {
    font-size: 13px;
    color: #6B6B70;
    margin-bottom: 22px;
    line-height: 1.45;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 14px;
  }
  .field label {
    font-size: 13px;
    font-weight: 500;
    color: #1C1C1E;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .field label .code {
    font-size: 11px;
    font-weight: 500;
    color: #9A9A9E;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  .input-wrap {
    display: flex;
    align-items: center;
    height: 44px;
    padding: 0 14px;
    border-radius: 8px;
    border: 1px solid rgba(28,28,30,0.12);
    background: #FFFFFF;
    gap: 8px;
  }
  .input-wrap .val {
    flex: 1;
    font-size: 15px;
    font-weight: 600;
    color: #1C1C1E;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }
  .input-wrap .unit {
    font-size: 13px;
    font-weight: 500;
    color: #6B6B70;
  }
  .helper.strong {
    font-size: 12px;
    color: #1C1C1E;
    background: rgba(184,92,92,0.06);
    border: 1px solid rgba(184,92,92,0.14);
    border-radius: 8px;
    padding: 10px 12px;
    font-weight: 500;
    line-height: 1.5;
    margin-top: 4px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 40px;
    padding: 0 18px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    border: none;
    letter-spacing: 0.01em;
  }
  .btn-primary {
    background: #3D5A73;
    color: #FFFFFF;
  }
  .banner-danger {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 16px;
    border-radius: 8px;
    background: rgba(184,92,92,0.08);
    border: 1px solid rgba(184,92,92,0.22);
    margin-bottom: 20px;
  }
  .banner-danger .ico {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: rgba(184,92,92,0.18);
    color: #B85C5C;
    display: grid;
    place-items: center;
    flex-shrink: 0;
    margin-top: 1px;
    font-size: 12px;
    font-weight: 700;
  }
  .banner-danger .body { flex: 1; min-width: 0; }
  .banner-danger .msg {
    font-size: 13px;
    font-weight: 600;
    color: #B85C5C;
    line-height: 1.45;
    margin-bottom: 10px;
  }
</style>
</head>
<body>
<div class="desk">
  <div class="desk-label"><strong>Agent Gig</strong> · 发单错误 · 额度</div>
  <div class="desk-meta">D-MVP-7 · Budget</div>
  <div class="panel">
    <div class="panel-top">
      <div class="panel-title">
        <span class="brand-mark">G</span>
        Gig Skill
      </div>
      <button class="panel-close" type="button" aria-label="关闭">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M3 3l8 8M11 3L3 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="panel-body">
      <nav class="nav">
        <button class="nav-item" type="button">Connect</button>
        <button class="nav-item is-on" type="button">Budget</button>
        <button class="nav-item" type="button">Audit</button>
        <button class="nav-item is-disabled" type="button">Pay<span class="soon">只读</span></button>
        <button class="nav-item is-disabled" type="button">Portfolio<span class="soon">即将开放 · V0.5</span></button>
      </nav>
      <main class="content">
        <div class="page-h">Budget</div>
        <div class="page-sub">发单因额度校验失败已取消。</div>

        <div class="banner-danger">
          <div class="ico">!</div>
          <div class="body">
            <div class="msg">已超过单笔/日/总额度，发单已取消，未锁定资金</div>
            <button class="btn btn-primary" type="button">去调整额度</button>
          </div>
        </div>

        <div class="field">
          <label>总额度 <span class="code">totalCap</span></label>
          <div class="input-wrap">
            <span class="val">500.00</span>
            <span class="unit">GigUSD</span>
          </div>
        </div>
        <div class="field">
          <label>单笔上限 <span class="code">perOrderCap</span></label>
          <div class="input-wrap">
            <span class="val">50.00</span>
            <span class="unit">GigUSD</span>
          </div>
        </div>
        <div class="field">
          <label>日额度 <span class="code">dailyCap</span></label>
          <div class="input-wrap">
            <span class="val">120.00</span>
            <span class="unit">GigUSD</span>
          </div>
        </div>

        <p class="helper strong">超限额将直接拒绝发单，请调高额度后再试</p>
      </main>
    </div>
  </div>
</div>
</body>
</html>
